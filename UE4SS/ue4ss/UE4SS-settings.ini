; UE4SS settings for Palworld Mods ULTRA MAX
; External trainer app (PalTrainerApp) replaces in-game ImGui overlay.
; Therefore GuiConsoleEnabled/Visible are kept at 0 to avoid lag.

[Debug]
; Disable ImGui GUI console - we use the external Python trainer app
ConsoleEnabled = 1
GuiConsoleEnabled = 0
GuiConsoleVisible = 0
GraphicsAPI = dx11
RenderMode = GameViewportClientTick
DebugGUIFontScaling = 1.0

[General]
UseCache = 1
InvalidateCacheIfDLLDiffers = 1
bUseUObjectArrayCache = false

[Hooks]
HookEngineTick = 1
HookGameViewportClientTick = 1
